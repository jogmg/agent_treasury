# Hermes User profile - Phase 2 (BFF-only, reads + unsigned draft actions)
#
# This is the user-facing agent behind the frontend Ask Hermes dock. It is
# reached only through the authenticated BFF on the private Compose network.
# It has no Discord gateway, terminal, filesystem, browser, or signing tool.
#
# The BFF owns SIWE sessions and deterministic draft intents. The model may call
# the read-only Arc/CCTP tools below and emit one semantic action proposal; it
# cannot construct arbitrary calldata, choose a wallet, or move funds.

# Google Gemini free tier (AI Studio). The provider key is GEMINI_API_KEY or
# GOOGLE_API_KEY in the profile env. GEMINI_BASE_URL is optional; the provider
# default is https://generativelanguage.googleapis.com/v1beta (native Gemini).
#
# Gemini 3.5 Flash-Lite is the primary for this latency-sensitive public
# profile. Gemini 3.8 Flash is kept as a higher-quality fallback, but its
# current free-tier demand spikes can spend the whole browser deadline timing
# out. All entries stay on Google's free tier so an outage never silently moves
# the public agent to a paid model.
model:
  provider: "gemini"
  default: "gemini-3.5-flash-lite"

model_aliases:
  gemini-flash:
    provider: "gemini"
    model: "gemini-3.8-flash"
  gemini-3.6:
    provider: "gemini"
    model: "gemini-3.6-flash"
  gemini-flash-lite:
    provider: "gemini"
    model: "gemini-3.5-flash-lite"

fallback_providers:
  # Keep the slow, demand-spiky 3.8 model last so it cannot consume the public
  # tunnel's ~60s browser deadline before a lite model gets a chance.
  - provider: "gemini"
    model: "gemini-3.6-flash"
  - provider: "gemini"
    model: "gemini-3.1-flash-lite"
  - provider: "gemini"
    model: "gemini-3.8-flash"

# Fail over quickly; the BFF and the public tunnel have their own deadlines.
providers:
  gemini:
    request_timeout_seconds: 20
    stale_timeout_seconds: 30

auxiliary:
  compression:
    provider: "gemini"
    model: "gemini-3.6-flash"
  title_generation:
    provider: "gemini"
    model: "gemini-3.5-flash-lite"

# The BFF is the only caller. The API server is private to the Compose
# network; do not publish port 8642.
gateway:
  standalone: true
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    key: ${API_SERVER_KEY}
    max_concurrent_runs: 4

mcp_servers:
  arc-treasury:
    url: "http://arc-mcp:8788/mcp"
    headers:
      Authorization: "Bearer ${ARC_MCP_TOKEN_USER}"
    trust: untrusted
    timeout: 60
    connect_timeout: 10
    tools:
      include:
        - arc_get_config
        - arc_get_treasury_state
        - arc_list_activity
        - arc_get_cctp_status
        - arc_get_transfer
      resources: false
      prompts: false

agent:
  api_max_retries: 1
  auto_recovery_cycles: 1
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - search
    - skills
    - memory
    - session_search
    - code_execution
    - delegation
    - cronjob
    - vision
    - image_gen
    - video_gen
    - tts
    - computer_use
    - connections
    - catalog
    - desktop_ui
    - project
    - kanban
    - discord_admin
    - x_search

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

security:
  redact_secrets: true
