# Hermes Ops profile - Phase 1 (read-only)
#
# This profile lives in the private Discord server. It can read the Arc/CCTP
# MCP server, but it has no terminal, filesystem, browser, or signing ability.
# The LLM is never the source of truth: balances and CCTP status come from the
# MCP tools, which query Arc/Iris/Postgres deterministically.

# Google Gemini free tier (AI Studio). The provider key is GEMINI_API_KEY or
# GOOGLE_API_KEY in ../.env. GEMINI_BASE_URL is optional; the provider default
# is https://generativelanguage.googleapis.com/v1beta (native Gemini API).
#
# Gemini 3.8 Flash is the primary free model: 1M-token input context, function
# calling, and a free tier. The fallbacks stay on Google's free tier so a rate
# limit or outage never silently moves Ops to a paid OpenAI/Anthropic model.
# Switch manually for a session with /model gemini-flash (or another alias
# below), or edit model.default.
model:
  provider: "gemini"
  default: "gemini-3.8-flash"

model_aliases:
  gemini-flash:
    provider: "gemini"
    model: "gemini-3.8-flash"
  gemini-3.6:
    provider: "gemini"
    model: "gemini-3.6-flash"
  gemini-flash-lite:
    provider: "gemini"
    model: "gemini-3.5-flash-lite"

# Primary model fallback chain. All entries use the same Gemini key and remain
# on free-tier models; a model can be unavailable or rate-limited independently.
fallback_providers:
  - provider: "gemini"
    model: "gemini-3.6-flash"
  - provider: "gemini"
    model: "gemini-3.5-flash-lite"
  - provider: "gemini"
    model: "gemini-3.1-flash-lite"

# Fail over quickly instead of retrying the same stalled/limited model.
# The default 1800s non-streaming timeout is far too long for Discord chat.
providers:
  gemini:
    request_timeout_seconds: 45
    stale_timeout_seconds: 60

# Keep side tasks cheap and on a fast free model. If that model is unavailable,
# Hermes falls back to the main model chain.
auxiliary:
  compression:
    provider: "gemini"
    model: "gemini-3.6-flash"
  title_generation:
    provider: "gemini"
    model: "gemini-3.5-flash-lite"

# This deployment runs one private Ops bot, not a multi-profile host gateway.
# Hermes otherwise refuses a named-profile gateway and expects the default
# profile's multiplexed host gateway to serve Ops.
gateway:
  standalone: true

mcp_servers:
  arc-treasury:
    url: "http://arc-mcp:8788/mcp"
    headers:
      Authorization: "Bearer ${ARC_MCP_TOKEN_OPS}"
    trust: untrusted
    timeout: 60
    connect_timeout: 10
    tools:
      include:
        - arc_get_config
        - arc_get_treasury_state
        - arc_list_activity
        - arc_get_cctp_status
        - arc_get_transfer
        - arc_get_bookkeeping_queue
        - arc_get_incidents
      resources: false
      prompts: false

agent:
  # One retry per model, then move to the next free Gemini model.
  api_max_retries: 1
  auto_recovery_cycles: 1
  disabled_toolsets:
    - terminal
    - file
    - browser
    - web
    - search
    - skills
    - code_execution
    - delegation
    - cronjob
    - vision
    - image_gen
    - video_gen
    - tts
    - computer_use
    - connections
    - catalog
    - desktop_ui
    - project
    - kanban
    - discord_admin
    - x_search

approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true

# Keep the ops profile from becoming a general-purpose agent.
security:
  redact_secrets: true
