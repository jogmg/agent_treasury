# Same-origin frontend and BFF reverse proxy.
#
# Public HTTPS terminates at Cloudflare Tunnel. cloudflared forwards to this
# nginx container over the private Compose network. nginx serves the built SPA
# and proxies only the BFF routes to bff:8789. Do not publish port 80 on the
# host; the tunnel is the only public entry point.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # The BFF owns these paths. Keep the URI unchanged when proxying.
    location /api/ {
        proxy_pass http://bff:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /auth/ {
        proxy_pass http://bff:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Useful for tunnel and BFF smoke tests without exposing the BFF directly.
    location = /health {
        proxy_pass http://bff:8789/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. Unknown API paths stay 404s at the BFF because the /api/
    # and /auth/ locations match before this rule.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
