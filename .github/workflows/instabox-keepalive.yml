name: InstaBox keepalive

# Manual fallback for the Cloudflare Worker cron in
# hermes/infra/cloudflare-keepalive/. GitHub Free does not run schedule events
# in private repositories, and the public-repo schedule was observed to be
# delayed for hours and to fail once on an InstaBox CLI checksum error. Keep this
# workflow manual-only; the Worker is the primary keepalive.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install InstaBox CLI
        run: npm install --global instabox@0.6.3

      - name: Wake and reset idle timer
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: m_agqvtg5gwokf3k7e5easq4hd5e
          INSTABOX_NO_TELEMETRY: "1"
        run: |
          set -euo pipefail
          # wake is a no-op when the machine is already running; if it paused
          # itself for idleness, wake resumes it. exec is the terminal activity
          # that resets the idle timer.
          instabox wake "$INSTABOX_MACHINE"
          instabox exec "$INSTABOX_MACHINE" -- true
